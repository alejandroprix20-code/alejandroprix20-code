name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # once per day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Fetch featured repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess

          with open("data/profile.json", encoding="utf-8") as f:
              profile = json.load(f)

          owner = profile["github_username"]
          out = []
          for name in profile.get("featured_repos", []):
              raw = subprocess.run(
                  ["gh", "api", f"repos/{owner}/{name}"],
                  capture_output=True, text=True, check=False,
              )
              if raw.returncode != 0:
                  print(f"Skipping {name}: {raw.stderr.strip()}")
                  continue
              d = json.loads(raw.stdout)
              out.append({
                  "name": d["name"],
                  "description": d.get("description") or "",
                  "language": d.get("language") or "",
                  "stars": d.get("stargazers_count", 0),
                  "forks": d.get("forks_count", 0),
                  "url": d["html_url"],
              })

          with open("data/repos.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          PY

      - name: Render SVG cards
        run: python scripts/render_readme_cards.py

      - name: Validate generated SVG files
        run: |
          python - <<'PY'
          import glob
          import xml.dom.minidom as minidom

          failures = []
          for path in sorted(glob.glob("cards/*.svg")):
              try:
                  minidom.parse(path)
              except Exception as exc:  # noqa: BLE001
                  failures.append((path, str(exc)))

          if failures:
              for path, err in failures:
                  print(f"INVALID {path}: {err}")
              raise SystemExit(1)

          print(f"Validated {len(glob.glob('cards/*.svg'))} SVG files.")
          PY

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json data/repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile art and contribution data"
            git push
          fi
