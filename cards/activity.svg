      }
    
    
        @keyframes revealUp {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        

            .stat-tiles {
              opacity: 0;
              animation: revealUp 0.5s ease-out forwards;
              animation-delay: 0.1s;
            }
            

            .chart-bars {
              opacity: 0;
              animation: revealUp 0.5s ease-out forwards;
              animation-delay: 0.3s;
            }
            
  </style>
