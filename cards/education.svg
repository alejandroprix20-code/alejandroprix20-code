<svg width="940" height="318" viewBox="0 0 940 318" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Alejandro Horna Quezada profile card</title>
  
    <defs>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C5CFC"/>
        <stop offset="100%" stop-color="#22D3EE"/>
      </linearGradient>
      <linearGradient id="panelFade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#111521"/>
        <stop offset="100%" stop-color="#0B0E14"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    
    
        @keyframes revealUp {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        

            .cert-0 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.1s;
            }
            

            .cert-1 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.18s;
            }
            

            .cert-2 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.26s;
            }
            

            .cert-3 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.33999999999999997s;
            }
            

            .cert-4 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.42000000000000004s;
            }
            

            .cert-5 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.5s;
            }
            
  </style>
  <rect x="0" y="0" width="940" height="318" rx="18" fill="#0B0E14"/>
  <rect x="1" y="1" width="938" height="316" rx="17" fill="none" stroke="#242B3D" stroke-width="1.5"/>
  <text x="42" y="52" font-size="20" font-weight="700" fill="#E6E9F0">Education &amp; Certifications</text>
<rect x="42" y="64" width="46" height="3" rx="1.5" fill="url(#accentGrad)"/>
<text x="42" y="92" font-size="13" font-weight="600" fill="#9AA4B8">CERTIFICATIONS</text>
<g class="cert-0">
<rect x="42" y="112" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="66" cy="135" r="5" fill="url(#accentGrad)"/>
<text x="84" y="132" font-size="12.5" font-weight="600" fill="#E6E9F0">Certificado de la carrera de UX/UI</text>
<text x="84" y="149" font-size="11" fill="#9AA4B8">Coderhouse · Sep 2023</text>
</g>
<g class="cert-1">
<rect x="480" y="112" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="504" cy="135" r="5" fill="url(#accentGrad)"/>
<text x="522" y="132" font-size="12.5" font-weight="600" fill="#E6E9F0">Curso de Diseño UX/UI Avanzado</text>
<text x="522" y="149" font-size="11" fill="#9AA4B8">Coderhouse · Apr 2024</text>
</g>
<g class="cert-2">
<rect x="42" y="168" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="66" cy="191" r="5" fill="url(#accentGrad)"/>
<text x="84" y="188" font-size="12.5" font-weight="600" fill="#E6E9F0">Certificado de Desarrollo Web</text>
<text x="84" y="205" font-size="11" fill="#9AA4B8">Coderhouse · Apr 2024</text>
</g>
<g class="cert-3">
<rect x="480" y="168" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="504" cy="191" r="5" fill="url(#accentGrad)"/>
<text x="522" y="188" font-size="12.5" font-weight="600" fill="#E6E9F0">Curso de Diseño UX/UI</text>
<text x="522" y="205" font-size="11" fill="#9AA4B8">Coderhouse · Nov 2023</text>
</g>
<g class="cert-4">
<rect x="42" y="224" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="66" cy="247" r="5" fill="url(#accentGrad)"/>
<text x="84" y="244" font-size="12.5" font-weight="600" fill="#E6E9F0">Curso de Python</text>
<text x="84" y="261" font-size="11" fill="#9AA4B8">Coderhouse · Aug 2024</text>
</g>
<g class="cert-5">
<rect x="480" y="224" width="418" height="46" rx="10" fill="url(#panelFade)" stroke="#242B3D" stroke-width="1"/>
<circle cx="504" cy="247" r="5" fill="url(#accentGrad)"/>
<text x="522" y="244" font-size="12.5" font-weight="600" fill="#E6E9F0">Curso de Photoshop e Illustrator</text>
<text x="522" y="261" font-size="11" fill="#9AA4B8">Coderhouse · Sep 2023</text>
</g>

</svg>
