<svg width="940" height="210" viewBox="0 0 940 210" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Alejandro Horna Quezada profile card</title>
  
    <defs>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C5CFC"/>
        <stop offset="100%" stop-color="#22D3EE"/>
      </linearGradient>
      <linearGradient id="panelFade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#111521"/>
        <stop offset="100%" stop-color="#0B0E14"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    
    
        @keyframes revealUp {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        

            .exp-0 {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.15s;
            }
            
  </style>
  <rect x="0" y="0" width="940" height="210" rx="18" fill="#0B0E14"/>
  <rect x="1" y="1" width="938" height="208" rx="17" fill="none" stroke="#242B3D" stroke-width="1.5"/>
  <text x="42" y="52" font-size="20" font-weight="700" fill="#E6E9F0">Professional Experience</text>
<rect x="42" y="64" width="46" height="3" rx="1.5" fill="url(#accentGrad)"/>
<g class="exp-0">
<circle cx="52" cy="108" r="6" fill="url(#accentGrad)"/>
<text x="74" y="112" font-size="16.5" font-weight="700" fill="#E6E9F0">Diseñador de experiencias de usuario (UX Designer)</text>
<text x="74" y="134" font-size="13.5" font-weight="600" fill="url(#accentGrad)">Blimx</text>
<text x="74" y="154" font-size="12.5" fill="#9AA4B8">Jan 2023 – Present · Miami, FL, USA · Remote</text>
<text x="74" y="174" font-size="12.5" fill="#5F6A82">Designing user experiences and interfaces for Blimx's digital products, working remotely as part of</text>
<text x="74" y="192" font-size="12.5" fill="#5F6A82">the product team.</text>
</g>

</svg>
