<svg width="940" height="300" viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Alejandro Horna Quezada profile card</title>
  
    <defs>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C5CFC"/>
        <stop offset="100%" stop-color="#22D3EE"/>
      </linearGradient>
      <linearGradient id="panelFade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#111521"/>
        <stop offset="100%" stop-color="#0B0E14"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    
    
        @keyframes revealUp {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        

            .hero-name {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.1s;
            }
            

            .hero-handle {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.25s;
            }
            

            .hero-headline {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.4s;
            }
            

            .hero-meta {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.55s;
            }
            

            .hero-bio {
              opacity: 0;
              animation: revealUp 0.6s ease-out forwards;
              animation-delay: 0.7s;
            }
            
        @keyframes driftGlow {
          0%   { transform: translate(0px, 0px); }
          50%  { transform: translate(14px, -10px); }
          100% { transform: translate(0px, 0px); }
        }
        .glow-orb { animation: driftGlow 9s ease-in-out infinite; }
        
  </style>
  <rect x="0" y="0" width="940" height="300" rx="18" fill="#0B0E14"/>
  <rect x="1" y="1" width="938" height="298" rx="17" fill="none" stroke="#242B3D" stroke-width="1.5"/>
  
    <circle class="glow-orb" cx="820" cy="80" r="160" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)"/>
    <circle class="glow-orb" cx="140" cy="260" r="120" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)"/>

    <rect x="40" y="40" width="5" height="54" rx="2.5" fill="url(#accentGrad)"/>
    <text class="hero-name" x="62" y="70" font-size="34" font-weight="700" fill="#E6E9F0">Alejandro Horna Quezada</text>
    <text class="hero-handle" x="62" y="96" font-size="16" font-weight="500" fill="url(#accentGrad)">@alejandroprix20-code</text>

    <text class="hero-headline" x="42" y="140" font-size="19" font-weight="600" fill="#E6E9F0">UX/UI Designer &amp; Web Developer | Building Modern Digital Experiences</text>

    <g class="hero-meta">
      <text x="42" y="170" font-size="13.5" fill="#9AA4B8">📍 Trujillo, Peru</text>
    </g>
    <text class="hero-bio" x="42" y="205" font-size="13.5" fill="#9AA4B8">UX/UI Designer at Blimx, focused on designing and building clean, modern web experiences. I</text>
<text class="hero-bio" x="42" y="227" font-size="13.5" fill="#9AA4B8">work across the full product loop: research, interface design in Figma, and front-end</text>

</svg>
