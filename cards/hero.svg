    </g>
    <text class="r" style="animation-delay:0.12s" x="40" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="-1" fill="#13131A">Alejandro</text>
    <text class="r" style="animation-delay:0.26s" x="40" y="172" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="56" letter-spacing="-1" fill="#5B3DF5">Horna Quezada</text>
    <g class="r" style="animation-delay:0.45s">
