    </g>
    <text class="f" style="animation-delay:0.60s" x="42" y="236" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4B4B52">UX/UI Designer at Blimx, focused on designing and building clean, modern web experiences. I work</text>
