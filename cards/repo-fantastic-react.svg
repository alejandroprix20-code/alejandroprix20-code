<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190" role="img" aria-label="fantastic-react">
  <title>fantastic-react</title>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
.r{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .8s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p{animation:none!important;opacity:1!important;transform:none!important}}

  </style>
  <rect width="300" height="190" rx="16" fill="#F4F3EF"/>
  <text class="r" style="animation-delay:0.00s" x="24" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#13131A">fantastic-react</text>
<text class="f" style="animation-delay:0.20s" x="24" y="66" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4B4B52">A full-stack secure password</text>
<text class="f" style="animation-delay:0.20s" x="24" y="84" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4B4B52">management application built with</text>
<text class="f" style="animation-delay:0.20s" x="24" y="102" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4B4B52">React, Vite, and modern web</text>
<line x1="24" y1="144" x2="276" y2="144" stroke="#E1DFD7" stroke-width="1"/>
<text class="f" style="animation-delay:0.35s" x="24" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B3DF5">JavaScript</text>
<text class="f" style="animation-delay:0.35s" x="150" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8A8A90">★ 0</text>
<text class="f" style="animation-delay:0.35s" x="210" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8A8A90">⑂ 0</text>

</svg>
