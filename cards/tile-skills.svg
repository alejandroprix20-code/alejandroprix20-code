<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" role="img" aria-label="EXPERIENCE &amp; SKILLS: What I build with">
  <title>EXPERIENCE &amp; SKILLS: What I build with</title>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
.r{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .8s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p{animation:none!important;opacity:1!important;transform:none!important}}

  </style>
  <rect width="300" height="180" rx="16" fill="#13131A"/>
  
    <g class="f" style="animation-delay:0.10s">
      <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#F4F3EF" opacity="0.8">EXPERIENCE &amp; SKILLS</text>
    </g>
    <text class="r" style="animation-delay:0.22s" x="22" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F4F3EF">What I build with</text>
    <text class="f" style="animation-delay:0.40s" x="24" y="154" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#F4F3EF" opacity="0.85">Scroll down ↓</text>
    <text class="f" style="animation-delay:0.40s" x="260" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F4F3EF">&#8599;</text>
    
</svg>
